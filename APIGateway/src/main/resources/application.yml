server:
  port: 8080

spring:
  application:
    name: APIGATEWAY
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: USER-SERVICE
              uri: lb://USERSERVICE
              predicates:
              - Path=/user/**

            - id: HOTEL-SERVICE
              uri: lb://HOTELSERVICE
              predicates:
              - Path=/hotels/**

            - id: RATINGS-SERVICE
              uri: lb://RATINGSSERVICE
              predicates:
              - Path=/ratings/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
